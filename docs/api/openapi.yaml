openapi: 3.0.3
info:
  title: Todo App API
  version: 1.0.0
  description: |
    待办事项管理 App 的 REST 与同步接口规范。

    约定：
    - 基础路径 `/v1`，JSON，字段 camelCase。
    - 时间为 ISO 8601 UTC，日期为 `YYYY-MM-DD`。
    - 移动端写入统一走本地 Outbox + `POST /v1/sync/push`；REST 写接口供 Web、管理后台与支持工具使用。
    - 错误响应统一为 `{ "error": { "code", "message", "details", "requestId" } }`。
    - 同步游标只由 `GET /v1/sync/pull` 推进；push 响应不返回游标。
  contact:
    name: Todo App Engineering
  license:
    name: Proprietary
    url: https://todo-app.test/license
servers:
  - url: https://api.todo-app.test
    description: Production（部署时替换为实际域名）
  - url: https://api.staging.todo-app.test
    description: Staging
tags:
  - name: Auth
    description: 邮箱验证码、Apple/Google 登录、令牌轮换与退出。
  - name: Me
    description: 当前用户资料、设置与账号注销。
  - name: Devices
    description: 设备、推送 token 与会话管理。
  - name: Lists
    description: 收件箱与自定义清单。
  - name: Tasks
    description: 任务 CRUD、完成、撤销、批量与排序。
  - name: Tags
    description: 标签管理（P1）。
  - name: Sync
    description: 增量同步：快照、push、pull。
  - name: Attachments
    description: 附件直传与元数据（P1）。
  - name: Export
    description: 异步数据导出。
  - name: Stats
    description: 完成数聚合（P2）。
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: 发送邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: 验证码已发送（不泄露邮箱是否存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: 校验验证码并签发令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/oauth/apple:
    post:
      tags: [Auth]
      operationId: loginWithApple
      summary: Apple 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/oauth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Google 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 轮换刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前设备
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: 退出所有设备并撤销令牌
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 当前用户与设置
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: 更新资料与设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新后的用户与设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: 注销账号（异步清理）
      responses:
        '202':
          description: 已进入删除流程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: 设备列表
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: 更新设备名或推送 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: 更新后的设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: 移除设备（令牌立即失效）
      responses:
        '204':
          description: 已移除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lists:
    get:
      tags: [Lists]
      operationId: listLists
      summary: 清单列表
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 清单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Lists]
      operationId: createList
      summary: 新建清单
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      tags: [Lists]
      operationId: updateList
      summary: 编辑/归档/排序清单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '200':
          description: 更新后的清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Lists]
      operationId: deleteList
      summary: 删除清单并指定任务去向
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteListRequest'
      responses:
        '204':
          description: 已删除
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 查询任务
      parameters:
        - name: view
          in: query
          schema:
            $ref: '#/components/schemas/TaskView'
        - name: listId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, completed, deleted]
        - name: q
          in: query
          description: 标题/备注子串搜索
          schema:
            type: string
            maxLength: 200
        - name: dueFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 任务页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: 新建任务（Web/管理端；移动端走同步）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 任务详情
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: 编辑任务
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: 软删除任务
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tasks/{taskId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: restoreTask
      summary: 从回收站恢复
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tasks/{taskId}/complete:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: 完成当前实例/任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: 完成结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteTaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tasks/{taskId}/uncomplete:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: uncompleteTask
      summary: 撤销最近一次完成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UncompleteTaskRequest'
      responses:
        '200':
          description: 撤销后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tasks/batch:
    post:
      tags: [Tasks]
      operationId: batchTasks
      summary: 批量完成/移动/删除
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTaskRequest'
      responses:
        '200':
          description: 逐条结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tasks/reorder:
    post:
      tags: [Tasks]
      operationId: reorderTasks
      summary: 拖拽排序
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTasksRequest'
      responses:
        '204':
          description: 已保存
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: 标签列表（P1）
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tags]
      operationId: createTag
      summary: 新建标签（P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: 编辑标签（P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: 更新后的标签
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: 删除标签（P1）
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sync/snapshot:
    get:
      tags: [Sync]
      operationId: getSyncSnapshot
      summary: 获取首次全量同步游标
      responses:
        '200':
          description: 当前游标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sync/push:
    post:
      tags: [Sync]
      operationId: pushSyncOps
      summary: 批量上传本地操作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: 逐条处理结果（不返回拉取游标）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sync/pull:
    get:
      tags: [Sync]
      operationId: pullSyncChanges
      summary: 按 since 拉取增量变更
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: 变更页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/CursorExpired'
  /v1/attachments/presign:
    post:
      tags: [Attachments]
      operationId: presignAttachment
      summary: 获取附件直传 URL（P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignAttachmentRequest'
      responses:
        '200':
          description: 预签名信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignAttachmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/attachments:
    post:
      tags: [Attachments]
      operationId: completeAttachmentUpload
      summary: 确认附件上传完成（P1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAttachmentRequest'
      responses:
        '201':
          description: 附件元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: 删除附件（P1）
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/export:
    post:
      tags: [Export]
      operationId: createExport
      summary: 创建导出任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: 导出任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/export/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Export]
      operationId: getExport
      summary: 查询导出进度与下载链接
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/export/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Export]
      operationId: downloadExport
      summary: 下载导出文件
      description: |
        本地/对象存储适配器提供的下载入口；生产部署可替换为预签名对象存储 URL。
        下载链接 24 小时有效，过期或不存在时返回 404。
      responses:
        '200':
          description: 导出文件内容
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stats/summary:
    get:
      tags: [Stats]
      operationId: getStatsSummary
      summary: 完成数聚合（P2）
      responses:
        '200':
          description: 统计摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: todo_session
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: 不透明游标；由上一页返回
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 客户端生成的 UUID；同 key 重试返回相同结果
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: 实体版本号；与服务端 version 不一致时返回 412/409
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 版本冲突或完成冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match 版本不匹配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 触发限流
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CursorExpired:
      description: 同步游标超过变更日志保留期，需要全量重建
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              example: 任务已被其他设备修改
            details:
              type: object
              additionalProperties: true
              example:
                currentVersion: 7
            requestId:
              type: string
              example: req_01J8ZQ8Z8Z8Z8Z8Z8Z8Z8Z8Z8Z
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - DELETED
        - REBUILD_REQUIRED
        - CURSOR_EXPIRED
        - RATE_LIMITED
        - INTERNAL
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 验证码已发送
    OtpRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    OtpVerifyRequest:
      type: object
      required: [email, code, device]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    OAuthRequest:
      type: object
      required: [identityToken, device]
      additionalProperties: false
      properties:
        identityToken:
          type: string
          description: Apple identityToken 或 Google idToken
          minLength: 20
        device:
          $ref: '#/components/schemas/DeviceInfo'
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 20
    DeviceInfo:
      type: object
      required: [name, platform]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [ios, android, web]
        appVersion:
          type: string
          maxLength: 32
        osVersion:
          type: string
          maxLength: 32
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, deviceId, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        deviceId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, displayName, timezone, locale, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          type: string
          example: Asia/Shanghai
        locale:
          type: string
          enum: [zh-CN, en]
        createdAt:
          type: string
          format: date-time
    UserSettings:
      type: object
      required: [theme, weekStart, timeFormat, defaultReminderTime]
      properties:
        theme:
          type: string
          enum: [system, light, dark]
        accent:
          type: string
          enum: [coral, teal, amber, indigo]
        weekStart:
          type: string
          enum: [monday, sunday]
        defaultListId:
          type: string
          format: uuid
          nullable: true
        defaultReminderTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:00'
        timeFormat:
          type: string
          enum: ['12h', '24h']
        quietHours:
          type: object
          nullable: true
          required: [start, end]
          properties:
            start:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            end:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        notificationPrefs:
          type: object
          additionalProperties:
            type: boolean
          example:
            reminders: true
            digest: false
        version:
          type: integer
          format: int64
    MeResponse:
      type: object
      required: [user, settings]
      properties:
        user:
          $ref: '#/components/schemas/User'
        settings:
          $ref: '#/components/schemas/UserSettings'
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        avatar:
          type: string
          maxLength: 64
        timezone:
          type: string
          description: IANA 时区名称
          example: Asia/Shanghai
        locale:
          type: string
          enum: [zh-CN, en]
        settings:
          $ref: '#/components/schemas/UserSettings'
    DeleteAccountResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [deletion_scheduled]
        deleteAfter:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, name, platform, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        pushProvider:
          type: string
          enum: [apns, fcm, expo, huawei, xiaomi, oppo, vivo, jpush, getui]
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        pushToken:
          type: string
          maxLength: 512
          nullable: true
        pushProvider:
          type: string
          enum: [apns, fcm, expo, huawei, xiaomi, oppo, vivo, jpush, getui]
          nullable: true
    List:
      type: object
      required: [id, name, color, icon, sortRank, isArchived, isDefault, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          maxLength: 32
        icon:
          type: string
          maxLength: 32
        sortRank:
          type: string
        isArchived:
          type: boolean
        isDefault:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateListRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的 UUIDv7
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          maxLength: 32
        icon:
          type: string
          maxLength: 32
        sortRank:
          type: string
    UpdateListRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          maxLength: 32
        icon:
          type: string
          maxLength: 32
        sortRank:
          type: string
        isArchived:
          type: boolean
    DeleteListRequest:
      type: object
      additionalProperties: false
      properties:
        taskAction:
          type: string
          enum: [move_to_inbox, delete_tasks]
          default: move_to_inbox
    TaskView:
      type: string
      enum: [today, upcoming, all, completed, trash]
    ReminderSpec:
      type: object
      required: [id, offsetMinutes]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        offsetMinutes:
          type: integer
          minimum: -10080
          maximum: 1440
          description: 相对到期时间的偏移；负数表示提前
    Recurrence:
      type: object
      nullable: true
      required: [rule, timezone, dtstart, seq]
      properties:
        rule:
          type: string
          maxLength: 512
          description: RRULE 频率子集，不含 COUNT/UNTIL
          example: FREQ=WEEKLY;INTERVAL=1;BYDAY=MO
        timezone:
          type: string
          example: Asia/Shanghai
        dtstart:
          type: string
          format: date-time
        until:
          type: string
          format: date
          nullable: true
        countRemaining:
          type: integer
          minimum: 0
          nullable: true
        seq:
          type: integer
          minimum: 0
    Task:
      type: object
      required: [id, listId, title, priority, sortRank, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        notes:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 3
        dueDate:
          type: string
          format: date
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        lastCompletedAt:
          type: string
          format: date-time
          nullable: true
        reminderSpec:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReminderSpec'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        tagIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        sortRank:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    CreateTaskRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的 UUIDv7
        listId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        notes:
          type: string
          maxLength: 10000
        priority:
          type: integer
          minimum: 0
          maximum: 3
        dueDate:
          type: string
          format: date
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        reminderSpec:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReminderSpec'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        tagIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        sortRank:
          type: string
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      properties:
        listId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 500
        notes:
          type: string
          maxLength: 10000
        priority:
          type: integer
          minimum: 0
          maximum: 3
        dueDate:
          type: string
          format: date
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        reminderSpec:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReminderSpec'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        tagIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        sortRank:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 仅用于一次性任务；重复任务请调用 complete 接口
    TaskPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
    CompleteTaskRequest:
      type: object
      additionalProperties: false
      properties:
        occurrenceKey:
          type: string
          description: 重复任务当前实例键；一次性任务可省略
          example: date:2026-11-02
        completionId:
          type: string
          format: uuid
          description: 客户端生成的完成 ID，用于撤销与幂等
      required: [completionId]
    CompleteTaskResponse:
      type: object
      required: [task, status, completionId]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        status:
          type: string
          enum: [completed, already_completed]
        completionId:
          type: string
          format: uuid
    UncompleteTaskRequest:
      type: object
      required: [completionId]
      additionalProperties: false
      properties:
        completionId:
          type: string
          format: uuid
    BatchTaskRequest:
      type: object
      required: [action, taskIds]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [complete, delete, move]
        taskIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
        targetListId:
          type: string
          format: uuid
          description: action=move 时必填
    BatchTaskResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [taskId, status]
            properties:
              taskId:
                type: string
                format: uuid
              status:
                type: string
                enum: [applied, rejected, conflict]
              task:
                $ref: '#/components/schemas/Task'
              error:
                $ref: '#/components/schemas/ErrorResponse'
    ReorderTasksRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [taskId, sortRank]
            properties:
              taskId:
                type: string
                format: uuid
              sortRank:
                type: string
    Tag:
      type: object
      required: [id, name, color, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTagRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        color:
          type: string
          maxLength: 32
    UpdateTagRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        color:
          type: string
          maxLength: 32
    SyncSnapshotResponse:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: integer
          format: int64
          example: 10231
    SyncPushRequest:
      type: object
      required: [deviceId, ops]
      additionalProperties: false
      properties:
        deviceId:
          type: string
          format: uuid
        localDeliveries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LocalDelivery'
        ops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncOp'
    LocalDelivery:
      type: object
      required: [reminderId, occurrenceKey, deliveredAt]
      properties:
        reminderId:
          type: string
          format: uuid
        occurrenceKey:
          type: string
        deliveredAt:
          type: string
          format: date-time
    SyncOp:
      type: object
      required: [opId, entity, entityId, op]
      additionalProperties: false
      properties:
        opId:
          type: string
          format: uuid
        entity:
          type: string
          enum: [task, list, tag]
        entityId:
          type: string
          format: uuid
        op:
          type: string
          enum: [create, update, delete, complete, uncomplete]
        baseVersion:
          type: integer
          format: int64
          minimum: 0
          description: create 省略；其余必填
        patch:
          $ref: '#/components/schemas/SyncPatch'
        occurrenceKey:
          type: string
          description: complete/uncomplete 重复任务时必填
        completionId:
          type: string
          format: uuid
          description: complete/uncomplete 时必填
    SyncPatch:
      type: object
      additionalProperties: false
      description: 按 entity 可选字段；服务端按实体类型校验
      properties:
        title:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 10000
        listId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 3
        dueDate:
          type: string
          format: date
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        reminderSpec:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReminderSpec'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        tagIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        sortRank:
          type: string
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 32
        icon:
          type: string
          maxLength: 32
        isArchived:
          type: boolean
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOpResult'
    SyncOpResult:
      type: object
      required: [opId, status]
      properties:
        opId:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, merged, conflict, already_completed, rejected]
        version:
          type: integer
          format: int64
          nullable: true
        conflictFields:
          type: array
          items:
            type: string
        task:
          $ref: '#/components/schemas/Task'
        error:
          $ref: '#/components/schemas/ErrorResponse'
    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: integer
          format: int64
        hasMore:
          type: boolean
    SyncChange:
      type: object
      required: [seq, entity, entityId, op, version, changedFields]
      properties:
        seq:
          type: integer
          format: int64
        entity:
          type: string
          enum: [task, list, tag]
        entityId:
          type: string
          format: uuid
        op:
          type: string
          enum: [upsert, delete]
        version:
          type: integer
          format: int64
        changedFields:
          type: object
          additionalProperties: true
    PresignAttachmentRequest:
      type: object
      required: [taskId, filename, mime, size]
      additionalProperties: false
      properties:
        taskId:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        mime:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        size:
          type: integer
          minimum: 1
          maximum: 20971520
    PresignAttachmentResponse:
      type: object
      required: [attachmentId, uploadUrl, method, expiresAt, headers]
      properties:
        attachmentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
    CompleteAttachmentRequest:
      type: object
      required: [attachmentId, checksum]
      additionalProperties: false
      properties:
        attachmentId:
          type: string
          format: uuid
        checksum:
          type: string
          description: SHA-256 hex
          pattern: '^[a-f0-9]{64}$'
    Attachment:
      type: object
      required: [id, taskId, filename, mime, size, checksum, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
        checksum:
          type: string
        downloadUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateExportRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [json, csv]
    ExportJob:
      type: object
      required: [id, status, format, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
