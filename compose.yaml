services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_dev
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptodo']
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - todo-mysql:/var/lib/mysql

volumes:
  todo-mysql:
