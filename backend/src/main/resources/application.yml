server:
  port: ${PORT:3000}
  shutdown: graceful

spring:
  application:
    name: todo-backend
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/todo_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:todo}
    password: ${DATABASE_PASSWORD:todo}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
  global-config:
    banner: false

app:
  auth:
    issuer: ${JWT_ISSUER:todo-api}
    audience: ${JWT_AUDIENCE:todo-app}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    max-devices: ${MAX_DEVICES:10}
    otp-length: ${OTP_LENGTH:6}
    otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    otp-email-hourly-limit: ${OTP_EMAIL_HOURLY_LIMIT:10}
    otp-ip-hourly-limit: ${OTP_IP_HOURLY_LIMIT:30}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    apple-client-id: ${APPLE_CLIENT_ID:}
  mail:
    driver: ${MAIL_DRIVER:log}
    from: ${MAIL_FROM:Todo App <no-reply@todo-app.test>}
    resend-api-key: ${RESEND_API_KEY:}
  push:
    enabled: ${PUSH_ENABLED:false}
    driver: ${PUSH_DRIVER:log}
  export:
    storage-dir: ${STORAGE_DIR:./storage}
    public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:3000}
    ttl-hours: ${EXPORT_TTL_HOURS:24}
  limits:
    per-minute: ${RATE_LIMIT_PER_MINUTE:120}
    sync-per-minute: ${SYNC_RATE_LIMIT_PER_MINUTE:20}
  retention:
    trash-days: ${TRASH_RETENTION_DAYS:30}
    change-log-days: ${CHANGE_LOG_RETENTION_DAYS:30}
    processed-ops-days: ${PROCESSED_OPS_RETENTION_DAYS:30}
    reminder-days: ${REMINDER_RETENTION_DAYS:7}
    audit-days: ${AUDIT_RETENTION_DAYS:180}
    user-deletion-days: ${USER_DELETION_DAYS:30}
  worker:
    enabled: ${WORKER_ENABLED:true}
    reminder-tick-ms: ${REMINDER_TICK_MS:5000}
    export-tick-ms: ${EXPORT_TICK_MS:5000}
    cleanup-tick-ms: ${CLEANUP_TICK_MS:3600000}
  audit-ip-salt: ${AUDIT_IP_SALT:todo-app-local-salt}
